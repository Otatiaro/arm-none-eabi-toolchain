name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Whether Linux is built, or taken from the release LINUX_RELEASE names.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      linux_from: ${{ steps.plan.outputs.linux_from }}
    steps:
      - uses: actions/checkout@v5
      - id: plan
        run: |
          source versions.sh
          if [ "$LINUX_RELEASE" != "$RELEASE" ]; then
            echo "linux_from=${GCC_VERSION}-${LINUX_RELEASE}" >> "$GITHUB_OUTPUT"
          fi

  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.linux_from == ''
    steps:
      - uses: actions/checkout@v5
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y texinfo bison flex
      # Steps already done in an earlier run of the same recipe are reused
      # while the recipe is being worked on; a tag always builds from scratch.
      - name: Restore finished steps
        if: github.ref_type != 'tag'
        uses: actions/cache/restore@v4
        with:
          path: |
            work/src/*.tar.*
            work/stage1
            work/install-linux-x86_64
            work/build-linux-x86_64/*.done
          key: linux-${{ hashFiles('versions.sh', 'build.sh', 'patches/**') }}-${{ github.run_id }}
          # Same sources and script first; failing that, the latest cache of
          # all: a change to the script's later steps still skips the finished
          # ones, which the .done markers guard. Delete the caches to rebuild
          # from the sources.
          restore-keys: |
            linux-${{ hashFiles('versions.sh', 'build.sh', 'patches/**') }}-
            linux-
      - name: Build
        run: ./build.sh --jobs "$(nproc)"
      - name: Save finished steps
        if: always() && github.ref_type != 'tag'
        uses: actions/cache/save@v4
        with:
          path: |
            work/src/*.tar.*
            work/stage1
            work/install-linux-x86_64
            work/build-linux-x86_64/*.done
          key: linux-${{ hashFiles('versions.sh', 'build.sh', 'patches/**') }}-${{ github.run_id }}
      - name: Configure logs, on failure
        if: failure()
        run: |
          find work/build-linux-x86_64 work/stage1 -name config.log -mmin -240 2>/dev/null | while read -r f; do
            if grep -q "error" "$f"; then
              echo "::group::$f"
              grep -n -B3 -A20 "configure:[0-9]*: error\|cannot compute\|error:" "$f" | tail -n 120
              echo "::endgroup::"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: work/out/*.tar.xz
          if-no-files-found: error
      - name: Sources, for the release
        uses: actions/upload-artifact@v4
        with:
          name: sources
          path: |
            work/src/*.tar.xz
            work/src/*.tar.gz
          if-no-files-found: error

  windows-x86_64:
    name: Windows x86_64
    runs-on: ubuntu-latest
    needs: [plan, linux-x86_64]
    if: >
      !cancelled() && needs.plan.result == 'success' &&
      (needs.linux-x86_64.result == 'success' || needs.linux-x86_64.result == 'skipped')
    env:
      LINUX_FROM: ${{ needs.plan.outputs.linux_from }}
    steps:
      - uses: actions/checkout@v5
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y texinfo bison flex mingw-w64 zip
      - if: env.LINUX_FROM == ''
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: linux
      - name: The Linux toolchain of release ${{ env.LINUX_FROM }}
        if: env.LINUX_FROM != ''
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v$LINUX_FROM"
          archive="arm-none-eabi-toolchain-$LINUX_FROM-linux-x86_64.tar.xz"
          mkdir linux && cd linux
          curl --fail --silent --show-error --location --retry 3 -o "$archive" "$base/$archive"
          curl --fail --silent --show-error --location --retry 3 -o SHA256SUMS "$base/SHA256SUMS"
          sha256sum --check --ignore-missing SHA256SUMS
          rm SHA256SUMS
      - name: Put the Linux toolchain on PATH
        run: |
          tar -xJf linux/*.tar.xz -C "$HOME"
          echo "$HOME"/arm-none-eabi-toolchain-*/bin >> "$GITHUB_PATH"
      - name: Build
        run: ./build.sh --host x86_64-w64-mingw32 --jobs "$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: work/out/*.zip
          if-no-files-found: error
      - name: Sources, for the release
        if: env.LINUX_FROM != ''
        uses: actions/upload-artifact@v4
        with:
          name: sources
          path: |
            work/src/*.tar.xz
            work/src/*.tar.gz
          if-no-files-found: error

  release:
    name: Release
    if: >
      !cancelled() && startsWith(github.ref, 'refs/tags/v') &&
      needs.windows-x86_64.result == 'success'
    runs-on: ubuntu-latest
    needs: [plan, linux-x86_64, windows-x86_64]
    env:
      LINUX_FROM: ${{ needs.plan.outputs.linux_from }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="GCC toolchain for arm-none-eabi. See the README for what is in it and how it was built. The source tarballs it was built from are attached."
          if [ -n "$LINUX_FROM" ]; then
            notes="$notes Only the Windows build changed in this release: on Linux, use v$LINUX_FROM."
          fi
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "$notes"
